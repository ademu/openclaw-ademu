# ci — the plugin's own lanes. `test` runs on BOTH supported Node floors (node:sqlite must be
# unflagged on each); `acceptance` installs the packed tarball into a pinned OpenClaw host headlessly.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.3", "24.15.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: bash dev/privacy-audit.sh

  acceptance:
    name: acceptance (openclaw host)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: install the pinned OpenClaw host
        run: |
          set -eu
          version="$(node -p "require('./package.json').openclaw.build.openclawVersion")"
          echo "openclaw@$version"
          npm i -g "openclaw@$version"
          openclaw --version
      - name: headless acceptance
        run: bash scripts/ci-acceptance.sh
